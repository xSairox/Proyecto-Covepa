{% load static %}<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1E1E1A" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mantenciones">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>{% block titulo %}Ingreso · COVEPA Mantenciones{% endblock %}</title>
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="icon" href="{% static 'img/favicon.png' %}">
  <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">
  <script src="{% static 'js/tema.js' %}"></script>
  <link rel="stylesheet" href="{% static 'css/covepa.css' %}">
</head>
<body style="padding-bottom:0">
{% include "partials/iconos.html" %}
<main class="ingreso" id="contenido">
  <button class="cabecera__boton tema-flotante" type="button" data-alternar-tema hidden aria-label="Cambiar tema"><svg class="tema-luna" aria-hidden="true"><use href="#i-luna"/></svg><svg class="tema-sol" aria-hidden="true"><use href="#i-sol"/></svg></button>
  <div class="ingreso__caja">
    <img class="ingreso__logo" src="{% static 'img/logo-covepa-amarillo.png' %}" alt="COVEPA, la mejor solución" width="112" height="115">
    <div class="ingreso__tarjeta">
      {% include "partials/mensajes.html" %}
      {% block contenido %}{% endblock %}
    </div>
    <p class="ingreso__pie">{% block pie %}Sistema de gestión de inventario y mantenciones{% endblock %}</p>
  </div>
</main>
<script src="{% static 'js/app.js' %}" defer></script>
</body>
</html>
