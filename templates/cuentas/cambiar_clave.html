{% extends "base.html" %}
{% block titulo %}Cambiar contraseña · COVEPA{% endblock %}
{% block contenido %}
<div class="titulo-pagina"><h1>Cambiar contraseña</h1></div>
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% include "partials/formulario_campos.html" %}
  <p class="ayuda">Mínimo 10 caracteres, con letras y números.</p>
  <div class="acciones">
    <button class="boton" type="submit">Guardar contraseña</button>
    <a class="boton boton--secundario" href="{% url 'cuentas:perfil' %}">Cancelar</a>
  </div>
</form>
{% endblock %}
