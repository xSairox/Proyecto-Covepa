{% extends "base_ingreso.html" %}
{% block contenido %}
<h1>Recupera tu contraseña</h1>
<p>Escribe tu correo y te enviaremos un enlace para definir una contraseña nueva.</p>
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% include "partials/formulario_campos.html" %}
  <button class="boton boton--bloque" type="submit">Enviar enlace</button>
</form>
<p style="margin:16px 0 0"><a href="{% url 'cuentas:login' %}">Volver a ingresar</a></p>
{% endblock %}
