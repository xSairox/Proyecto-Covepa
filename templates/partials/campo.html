<div class="grupo{% if campo.widget_type == 'checkbox' %} grupo--casilla{% endif %}">
  {% if campo.widget_type == 'checkbox' %}
    <label for="{{ campo.id_for_label }}">{{ campo }} {{ campo.label }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<p class="ayuda">{{ campo.help_text }}</p>{% endif %}
  {{ campo.errors }}
</div>
