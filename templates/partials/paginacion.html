{% load covepa %}
{% if page_obj.has_other_pages %}
<nav class="paginacion" aria-label="Páginas">
  {% if page_obj.has_previous %}<a class="boton boton--secundario boton--chico" href="?page={{ page_obj.previous_page_number }}{% qs_sin_pagina %}">Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="boton boton--secundario boton--chico" href="?page={{ page_obj.next_page_number }}{% qs_sin_pagina %}">Siguiente</a>{% endif %}
</nav>
{% endif %}
