{% extends "base_ingreso.html" %}
{% block contenido %}
<h1>Ingresa a tu cuenta</h1>
<form method="post" class="formulario" novalidate>
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  {% include "partials/formulario_campos.html" %}
  <button class="boton boton--bloque" type="submit">Ingresar</button>
</form>
<p style="margin:16px 0 0"><a href="{% url 'cuentas:recuperar' %}">Olvidé mi contraseña</a></p>
{% endblock %}
